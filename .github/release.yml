changelog:
  exclude:
    authors:
      - github-actions[bot]
  categories:
    - title: Features
      labels:
        - feat
        - feature
        - enhancement
    - title: Bug Fixes
      labels:
        - fix
        - bug
    - title: Performance & Caching
      labels:
        - perf
        - performance
        - caching
    - title: Documentation & Maintenance
      labels:
        - documentation
        - docs
        - maintenance
        - chore
    - title: Other Changes
      labels:
        - "*"
