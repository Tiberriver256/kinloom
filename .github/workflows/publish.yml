name: Publish Packages to npm

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      bump:
        description: "SemVer bump when version is empty. auto follows conventional commits."
        type: choice
        options:
          - auto
          - patch
          - minor
          - major
        default: auto
      version:
        description: "Explicit version override, for example 0.2.1"
        required: false
        default: ""
        type: string
      dry_run:
        description: "Plan the release and run npm publish --dry-run"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: publish-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      should_release: ${{ steps.plan.outputs.should_release }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Skip release commits
        id: gate
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          echo "skip=false" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            subject="$(git log -1 --format=%s)"
            case "$subject" in
              'chore(release):'*)
                echo "skip=true" >> "$GITHUB_OUTPUT"
                ;;
            esac
          fi

      - name: Calculate the next version
        id: plan
        if: steps.gate.outputs.skip != 'true'
        env:
          RELEASE_BUMP: ${{ inputs.bump }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          plan="${RUNNER_TEMP:-/tmp}/release-plan.json"
          args=(next --json)
          if [ -n "${RELEASE_VERSION}" ]; then
            args+=(--force-version "${RELEASE_VERSION}")
          fi
          if [ -n "${RELEASE_BUMP}" ]; then
            args+=(--bump "${RELEASE_BUMP}")
          fi
          node scripts/release-version.mjs "${args[@]}" > "$plan"
          PLAN_PATH="$plan" node --input-type=module -e '
            import { readFileSync, appendFileSync } from "node:fs";
            const plan = JSON.parse(readFileSync(process.env.PLAN_PATH, "utf8"));
            const out = process.env.GITHUB_OUTPUT;
            appendFileSync(out, `should_release=${plan.should_release}\n`);
            appendFileSync(out, `version=${plan.version ?? ""}\n`);
            appendFileSync(out, `tag=${plan.tag ?? ""}\n`);
          '

      - name: Install tesseract and poppler
        if: steps.plan.outputs.should_release == 'true' && inputs.dry_run != true
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr poppler-utils

      - name: Bump, verify, tag, and create the GitHub release
        if: steps.plan.outputs.should_release == 'true' && inputs.dry_run != true
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.plan.outputs.version }}
          TAG: ${{ steps.plan.outputs.tag }}
        run: |
          set -euo pipefail
          case "$VERSION" in
            ''|*[!0-9.]*) echo "refusing version [$VERSION]" >&2; exit 1 ;;
          esac
          case "$TAG" in
            "v${VERSION}") ;;
            *) echo "refusing tag [$TAG]" >&2; exit 1 ;;
          esac

          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            git fetch origin "refs/tags/${TAG}:refs/tags/${TAG}" --force
            if ! git merge-base --is-ancestor HEAD "${TAG}^{commit}"; then
              echo "Refusing to reuse existing tag ${TAG} because it does not contain HEAD ($(git rev-parse --short HEAD))." >&2
              exit 1
            fi
            echo "Tag ${TAG} is already on origin and contains HEAD."
          else
            node scripts/release-version.mjs bump "$VERSION"
            npm ci
            npm run check
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -u -- packages examples/demo/package.json package-lock.json
            if git diff --cached --quiet; then
              echo "Version files already match ${VERSION}."
            else
              git commit -m "chore(release): v${VERSION}"
            fi
            if ! git rev-parse "$TAG" >/dev/null 2>&1; then
              git tag -a "$TAG" -m "$TAG"
            fi
            git push origin "HEAD:${GITHUB_REF_NAME}"
            git push origin "$TAG"
          fi

          repo="$GITHUB_REPOSITORY"
          server="${GITHUB_SERVER_URL:-https://github.com}"
          scratch="${RUNNER_TEMP:-/tmp}"
          plan="$scratch/release-plan.json"
          logins="$scratch/logins.txt"
          notes="$scratch/release-notes.md"
          previous="$(PLAN_PATH="$plan" node --input-type=module -e 'import { readFileSync } from "node:fs"; const plan = JSON.parse(readFileSync(process.env.PLAN_PATH, "utf8")); process.stdout.write(plan.previous_tag ?? "")')"
          compare=""
          if [ -n "$previous" ]; then
            compare="${server}/${repo}/compare/${previous}...${TAG}"
          fi

          : > "$logins"
          PLAN_PATH="$plan" node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const plan = JSON.parse(readFileSync(process.env.PLAN_PATH, "utf8"));
            for (const commit of plan.commits) process.stdout.write(`${commit.sha}\n`);
          ' | while IFS= read -r sha; do
            if [ -z "$sha" ]; then
              continue
            fi
            login="$(gh api "repos/${repo}/commits/${sha}" --jq '.author.login // empty' || true)"
            if [ -n "$login" ]; then
              printf '%s\n' "$login" >> "$logins"
            fi
          done

          note_args=(
            notes
            --plan "$plan"
            --out "$notes"
            --logins-file "$logins"
          )
          if gh release view "$TAG" >/dev/null 2>&1; then
            if [ -n "$compare" ]; then
              note_args+=(--compare-url "$compare")
            fi
            node scripts/release-version.mjs "${note_args[@]}"
            gh release edit "$TAG" --title "$TAG" --notes-file "$notes"
          else
            # gh 2.105.0 prepends --notes-file to the Release Notes API body, which already includes Full Changelog.
            node scripts/release-version.mjs "${note_args[@]}"
            create_args=(
              release create "$TAG"
              --title "$TAG"
              --verify-tag
              --generate-notes
              --notes-file "$notes"
            )
            if [ -n "$previous" ]; then
              create_args+=(--notes-start-tag "$previous")
            fi
            gh "${create_args[@]}"
          fi

  publish:
    needs: [release]
    if: >-
      always() &&
      needs.release.result != 'cancelled' &&
      (needs.release.result == 'success' || needs.release.result == 'skipped') &&
      (
        github.ref_type == 'tag' ||
        needs.release.outputs.should_release == 'true' ||
        (github.event_name == 'workflow_dispatch' && inputs.dry_run == true)
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check out the release tag
        if: needs.release.outputs.should_release == 'true' && inputs.dry_run != true
        env:
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          set -euo pipefail
          git fetch origin "refs/tags/${TAG}:refs/tags/${TAG}" --force
          git checkout --detach "refs/tags/${TAG}"

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install tesseract and poppler
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr poppler-utils

      - name: Ensure npm supports Trusted Publishing OIDC
        run: |
          npm install -g npm@latest
          node -v
          npm -v

      - name: Install dependencies
        run: npm ci

      - name: Run full verification suite (lint, build, typecheck, tests, contrast, leaks)
        run: npm run check

      - name: Verify release tag matches package versions
        if: github.ref_type == 'tag' || (needs.release.outputs.should_release == 'true' && inputs.dry_run != true)
        env:
          EXPECTED_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || needs.release.outputs.version }}
        run: |
          set -euo pipefail
          node scripts/release-version.mjs verify "${EXPECTED_VERSION#v}"

      - name: Publish @kinloom/* packages in topological order
        env:
          DRY_RUN: ${{ inputs.dry_run == true && 'true' || 'false' }}
        run: |
          set -euo pipefail
          unset NODE_AUTH_TOKEN || true
          unset NPM_TOKEN || true

          packages=(
            "packages/tokens"
            "packages/core"
            "packages/server"
            "packages/worker"
            "packages/cli"
            "packages/ui"
          )

          for dir in "${packages[@]}"; do
            name="$(node -p "JSON.parse(require('node:fs').readFileSync('${dir}/package.json', 'utf8')).name")"
            version="$(node -p "JSON.parse(require('node:fs').readFileSync('${dir}/package.json', 'utf8')).version")"

            if [ "${DRY_RUN}" = "true" ]; then
              echo "Dry-run publishing ${name}@${version}..."
              npm publish --workspace="${name}" --dry-run --access public
              continue
            fi

            if npm view "${name}@${version}" version --registry https://registry.npmjs.org/ >/dev/null 2>&1; then
              echo "Skipping ${name}@${version} because it is already published on npm."
              continue
            fi

            echo "Publishing ${name}@${version}..."
            npm publish --workspace="${name}" --provenance --access public
          done
