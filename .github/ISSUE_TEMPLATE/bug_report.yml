name: Bug report
description: Report a reproducible bug in Kinloom packages, CLI commands, or the demo archive.
title: "fix(...): "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Privacy fence:** Never paste living relatives' real names, birth dates, private GEDCOM exports, or personal family scans here. Use synthetic names or records from `examples/demo/`.

        For security or living-person privacy vulnerabilities, submit a [Private Security Advisory](https://github.com/Tiberriver256/kinloom/security/advisories/new) instead.

  - type: dropdown
    id: package
    attributes:
      label: Affected package or area
      options:
        - "@kinloom/core"
        - "@kinloom/server"
        - "@kinloom/worker"
        - "@kinloom/ui"
        - "@kinloom/cli"
        - "@kinloom/tokens"
        - "@kinloom/demo (GitHub Pages)"
        - "Documentation or CI"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: State the defect clearly and link any relevant route, command, or API endpoint.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include the exact command, route, or minimal synthetic fixture that reproduces the bug.
      placeholder: |
        1. Run `npx kinloom ...`
        2. Open `/...`
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: Describe what should happen instead.
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: Kinloom version, Node.js version, OS, and browser (if UI bug).
      placeholder: "kinloom 0.41.0, Node 24.x, Linux, Chromium"
    validations:
      required: true

  - type: checkboxes
    id: privacy-confirm
    attributes:
      label: Privacy confirmation
      options:
        - label: This report contains zero living-person records, private family names, or private scans.
          required: true
