- id: nar_atlantic_to_shenandoah
  slug: hingham-norfolk-to-shenandoah-valley
  title: From Hingham, Norfolk to Linville Creek (1622–1788)
  summary: Five colonial generations tracing weaver Samuel Lincoln's 1637 Atlantic crossing through Massachusetts ironworks, New Jersey, Pennsylvania, and Virginia's Shenandoah Valley.
  date_edtf: "1622/1788"
  person_ids:
