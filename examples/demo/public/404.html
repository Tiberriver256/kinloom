<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page Not Found — Lincoln &amp; Todd Historical Archive</title>
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" media="(prefers-color-scheme: light)" href="/favicon-light.svg" />
    <link rel="icon" type="image/svg+xml" media="(prefers-color-scheme: dark)" href="/favicon-dark.svg" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      :root {
        color-scheme: light dark;
        --paper: #f5efe2;
        --ink: #23272e;
        --heading: #1b2a41;
        --muted: #4e4a42;
        --accent: #7a4612;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --paper: #171614;
          --ink: #eae3d5;
          --heading: #ede6d9;
          --muted: #bdb3a3;
          --accent: #d89c56;
        }
      }
      body {
        margin: 0;
        background: var(--paper);
        color: var(--ink);
        font-family: Georgia, 'Times New Roman', serif;
        line-height: 1.64;
      }
      main {
        max-width: 680px;
        margin: 64px auto;
        padding: 0 24px;
      }
      h1 {
        color: var(--heading);
        margin: 0 0 12px;
      }
      p {
        color: var(--muted);
        margin: 0 0 20px;
      }
      a {
        color: var(--accent);
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Page Not Found</h1>
      <p>We could not find that archive page. Return to the main archive to browse people and the family tree.</p>
      <p><a href="/">Return to People</a> · <a href="/tree">Open Family Tree</a></p>
    </main>
  </body>
</html>
